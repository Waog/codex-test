name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTIFACT_NAME: dist-${{ github.run_id }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (with cache)
        if: ${{ hashFiles('**/package-lock.json', '**/npm-shrinkwrap.json', '**/yarn.lock', '**/pnpm-lock.yaml') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Node (no cache)
        if: ${{ hashFiles('**/package-lock.json', '**/npm-shrinkwrap.json', '**/yarn.lock', '**/pnpm-lock.yaml') == '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist
          retention-days: 1

  deploy-preview:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: preview/pr-${{ github.event.number }}
      url: https://waog.github.io/codex-test/pr/${{ github.event.number }}/
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: .

      - name: Deploy PR preview
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: false
          target-folder: pr/${{ github.event.number }}

      - name: Publish preview link
        run: |
          echo "### ✅ Preview deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "https://waog.github.io/codex-test/pr/${{ github.event.number }}/" >> "$GITHUB_STEP_SUMMARY"

      - name: Share preview link
        uses: thollander/actions-comment-pull-request@v2
        with:
          comment_tag: preview-url
          message: |
            ✅ A preview of this pull request is available at:
            https://waog.github.io/codex-test/pr/${{ github.event.number }}/

  deploy-production:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://waog.github.io/codex-test/
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: .

      - name: Deploy main site
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
          clean-exclude: |
            pr

      - name: Publish production link
        run: |
          echo "### 🚀 Production deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "https://waog.github.io/codex-test/" >> "$GITHUB_STEP_SUMMARY"
