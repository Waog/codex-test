name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTIFACT_NAME: dist-${{ github.run_id }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (with cache)
        if: ${{ hashFiles('**/package-lock.json', '**/npm-shrinkwrap.json', '**/yarn.lock', '**/pnpm-lock.yaml') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Node (no cache)
        if: ${{ hashFiles('**/package-lock.json', '**/npm-shrinkwrap.json', '**/yarn.lock', '**/pnpm-lock.yaml') == '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist
          retention-days: 1

  deploy-preview:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: preview/pr-${{ github.event.number }}
      url: https://waog.github.io/codex-test/pr/${{ github.event.number }}/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist

      - name: List preview files
        run: ls -R
        working-directory: dist

      - name: Publish PR preview
        id: publish_preview
        run: |
          set -euo pipefail
          original_head=$(git rev-parse HEAD)
          trap 'git checkout --force "$original_head" >/dev/null 2>&1 || true' EXIT
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git checkout gh-pages
            git reset --hard origin/gh-pages
          else
            git checkout --orphan gh-pages
            find . -mindepth 1 -maxdepth 1 \( -not -path './.git' -and -not -path './dist' \) -exec rm -rf {} +
          fi
          mkdir -p pr
          rm -rf "pr/${{ github.event.number }}"
          mkdir -p "pr/${{ github.event.number }}"
          rsync -a --delete dist/ "pr/${{ github.event.number }}/"
          touch .nojekyll
          git add -A "pr/${{ github.event.number }}" .nojekyll
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Deploy preview for PR #${{ github.event.number }}"
            git push origin gh-pages
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish preview link
        run: |
          if [ "${{ steps.publish_preview.outputs.changed }}" = "true" ]; then
            echo "### ✅ Preview deployed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ℹ️ Preview already up to date" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "https://waog.github.io/codex-test/pr/${{ github.event.number }}/" >> "$GITHUB_STEP_SUMMARY"

      - name: Share preview link
        uses: thollander/actions-comment-pull-request@v2
        with:
          comment_tag: preview-url
          message: |
            ✅ A preview of this pull request is available at:
            https://waog.github.io/codex-test/pr/${{ github.event.number }}/

  deploy-production:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://waog.github.io/codex-test/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist

      - name: List production files
        run: ls -R
        working-directory: dist

      - name: Publish production site
        id: publish_production
        run: |
          set -euo pipefail
          original_head=$(git rev-parse HEAD)
          trap 'git checkout --force "$original_head" >/dev/null 2>&1 || true' EXIT
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git checkout gh-pages
            git reset --hard origin/gh-pages
          else
            git checkout --orphan gh-pages
            find . -mindepth 1 -maxdepth 1 \( -not -path './.git' -and -not -path './dist' \) -exec rm -rf {} +
          fi
          mkdir -p pr
          find . -mindepth 1 -maxdepth 1 ! -name 'pr' ! -name '.git' ! -name 'dist' -exec rm -rf {} +
          rsync -a dist/ ./
          rm -rf dist
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Deploy production from ${GITHUB_SHA}"
            git push origin gh-pages
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish production link
        run: |
          if [ "${{ steps.publish_production.outputs.changed }}" = "true" ]; then
            echo "### 🚀 Production deployed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ℹ️ Production already up to date" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "https://waog.github.io/codex-test/" >> "$GITHUB_STEP_SUMMARY"
